title: UniSG Slides
author: Richard Conrardy
version: 0.1.0
quarto-required: ">=1.7.0"
contributes:
  metadata:
    project:
      brand: brand.yml
  formats:
    common:
      csl: csl/apa.csl
      filters:
        - filters/unisg.lua
    revealjs:
      logo: assets/logos/HSG_Logo_EN_RGB.svg
      theme: [default, styles/unisg-slides.scss]
      slide-number: true
      progress: true
      transition: fade
      width: 1600
      height: 900
      margin: 0
      center: false
      auto-stretch: false
      include-after-body: assets/js/fit-images.html
      chalkboard: true
      preview-links: auto
